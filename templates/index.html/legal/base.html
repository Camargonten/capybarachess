<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Capybara Chess{% endblock %} — Capybara Chess</title>
    <meta name="theme-color" content="#17221e">
    <link rel="icon" href="/static/capybara-icon.svg" type="image/svg+xml">
    <style>
        body { margin: 0; background: #17221e; color: #e5efe9; font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        main { max-width: 760px; margin: 0 auto; padding: 24px 18px 56px; }
        h1 { color: #e0a234; font-size: 1.7rem; margin: .2em 0 .1em; }
        h2 { color: #f3c969; font-size: 1.15rem; margin-top: 1.8em; }
        a { color: #8fd3b6; }
        p, li { color: #d3e2da; }
        .updated { color: #8aa399; font-size: .9rem; }
        .back { display: inline-block; margin-bottom: 8px; text-decoration: none; }
        .card { background: #1f2f29; border: 1px solid #2f4a40; border-radius: 12px; padding: 14px 16px; }
        footer { margin-top: 40px; color: #8aa399; font-size: .85rem; }
    </style>
</head>
<body>
<main>
    <a class="back" href="/">← Voltar ao jogo</a>
    {% block content %}{% endblock %}
    <footer>
        © Gabriel Rodrigues de Souza Camargo. Todos os direitos reservados.
        · <a href="/privacidade">Privacidade</a> · <a href="/termos">Termos de uso</a> · <a href="/excluir-conta">Excluir conta</a>
    </footer>
</main>
</body>
</html>
