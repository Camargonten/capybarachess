services:
  - type: web
    name: capybara-chess
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_PATH
        value: /tmp/capybara.db
      - key: STOCKFISH_PATH
        value: /usr/local/bin/stockfish
